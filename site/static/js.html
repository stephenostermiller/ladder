<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Ladder Game</title>
	<style>
		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}

		body {
			display: flex;
			flex-direction: column;
			width: 100vw;
			height: 100vh;
			background-color: #000;
			color: #0f0;
			font-family: Arial, sans-serif;
		}

		h1 {
			padding: 10px;
			text-align: center;
			flex-shrink: 0;
		}

		#gameContainer {
			background-color: #000;
			flex: 1;
			display: flex;
			align-items: center;
			justify-content: center;
			overflow: hidden;
		}

		canvas {
			display: block;
			background-color: #000;
			max-width: 100%;
			max-height: 100%;
			width: auto;
			height: auto;
		}

		.controls {
			text-align: center;
			font-size: 14px;
			flex-shrink: 0;
		}

		.controls h3 {
			margin: 10px 0;
		}

		.controls p {
			margin: 5px 0;
		}

		.stats {
			font-size: 14px;
			text-align: center;
			flex-shrink: 0;
		}

		.stats div {
			margin: 5px 0;
		}

		select {
			margin-top: 10px;
			padding: 5px;
			font-size: 14px;
			color: #0f0;
			background-color: #000;
			border: 1px solid #0f0;
			cursor: pointer;
		}

		button {
			color: #0f0;
			background-color: #000;
			border: 1px solid #0f0;
			cursor: pointer;
		}

		button:disabled {
			color: #555;
			border-color: #555;
			cursor: not-allowed;
		}

		select:disabled {
			color: #555;
			border-color: #555;
			cursor: not-allowed;
		}


		.game-settings {
			display: flex;
			flex-direction: row;
			gap: 20px;
			justify-content: space-evenly;
			flex-wrap: wrap;
			padding: 10px;
			align-items: flex-start;
		}

		.vertical-stack {
			display: flex;
			flex-direction: column;
			gap: 10px;
			align-items: center;
		}
	</style>
</head>
<body>
	<h1>Ladder Game</h1>
	<div id="gameContainer">
		<canvas id="gameCanvas"></canvas>
	</div>

	<div class="game-settings">
		<div class="stats">
			<div>Score: <span id="score">0</span></div>
			<div>Lives: <span id="lives">3</span></div>
			<div>Level: <span id="level">1</span></div>
			<div>Bonus Time: <span id="bonusTime">0</span></div>
		</div>

		<div class="controls">
			<h3>Controls</h3>
			<p>Arrow Keys: Move</p>
			<p>Spacebar: Jump</p>
			<p>P / Esc: Play and Pause</p>
		</div>

		<div class="vertical-stack">
			<label for="difficultySelect">Difficulty:</label>
			<select id="difficultySelect">
				<option value="EASY">Easy</option>
				<option value="MEDIUM" selected>Medium</option>
				<option value="HARD">Hard</option>
				<option value="VERY_HARD">Very Hard</option>
				<option value="IMPOSSIBLE">Impossible</option>
			</select>

			<label for="levelSelect">Level:</label>
			<select id="levelSelect"></select>

			<button id="startButton">Start Game</button>
		</div>

	</div>

	<script src="ladder.js"></script>
</body>
</html>
