    assertScreen: |-
      |    H |
      |    H |
      |   pH |
  - action: step
    assertScreen: |-
      |    H |
      |    H |
      |    p |
  - action: step
    assertScreen: |-
      |    H |
      |    p |
      |    H |
  - action: step
    assertScreen: |-
      |    p |
      |    H |
      |    H |
  - action: step
    assertScreen: |-
      |    g |
      |    H |
      |    H |
